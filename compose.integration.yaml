# Always combine with compose.yaml and use project departamental-five-phases.
# The integration runner refuses to use a different project or database port.
name: departamental-five-phases
services:
  aplicacion-web:
    ports: !override ["127.0.0.1:3105:3000"]
  pasarela-api:
    ports: !override ["127.0.0.1:8005:8000"]
  postgres:
    ports: !reset []
  servicio-autenticacion:
    networks: [auth-probe]
    ports: ["127.0.0.1:3301:3001"]
  auth-postgres:
    networks: [auth-probe]
    ports: ["127.0.0.1:55431:5432"]
  redis:
    ports: !reset []
  inventory-postgres:
    networks: [inventory-probe]
    ports: ["127.0.0.1:55433:5432"]
  analytics-postgres:
    networks: [analytics-probe]
    ports: ["127.0.0.1:55437:5432"]
  pricing-postgres:
    networks: [pricing-probe]
    ports: ["127.0.0.1:55434:5432"]
  crm-postgres:
    networks: [crm-probe]
    ports: ["127.0.0.1:55439:5432"]
  notification-postgres:
    networks: [notification-probe]
    ports: ["127.0.0.1:55440:5432"]
  orders-postgres:
    networks: [orders-probe]
    ports: ["127.0.0.1:55435:5432"]
  logistics-postgres:
    networks: [logistics-probe]
    ports: ["127.0.0.1:55438:5432"]
  smtp-capture:
    image: axllent/mailpit:v1.27.10
    ports: ["127.0.0.1:18025:8025"]
    networks: [notification-egress]
  servicio-notificaciones:
    networks: [notification-probe]
    environment:
      NOTIFICATION_DELIVERY_MODE: smtp
      SMTP_URL: smtp://smtp-capture:1025
      NOTIFICATION_FROM_EMAIL: promociones@example.test
      NOTIFICATION_RETRY_INTERVAL_SECONDS: "1"
    depends_on:
      smtp-capture:
        condition: service_started
  servicio-precios:
    networks: [pricing-probe]
    ports: ["127.0.0.1:3304:3004"]
  servicio-pedidos:
    networks: [orders-probe]
    ports: ["127.0.0.1:3305:3005"]
  rabbitmq:
    networks: [broker-probe]
    ports: ["127.0.0.1:55672:5672"]
  servicio-inventario:
    networks: [inventory-probe]
    ports: ["127.0.0.1:3303:3003"]
    environment:
      INVENTORY_RESERVATION_SWEEP_SECONDS: "1"
  servicio-analitica:
    networks: [analytics-probe]
    environment:
      ANALYTICS_INVENTORY_SYNC_SECONDS: "3"
  servicio-clientes:
    networks: [crm-probe]
    environment:
      # Keep campaign publishing deterministic while the runner checks eligibility.
      OUTBOX_PUBLISH_INTERVAL_MILLISECONDS: "60000"
  catalog-postgres:
    networks: [catalog-probe]
  servicio-catalogo:
    networks: [catalog-probe]
  servicio-logistica:
    networks: [logistics-probe]

# Loopback test ports need a non-internal bridge. Each probe bridge contains
# only the owning domain and its database; no shared database access network.
networks:
  auth-probe:
    ipam:
      config:
        - subnet: "${DATA_NETWORK_PREFIX:-10.242}.100.0/28"
  catalog-probe:
    ipam:
      config:
        - subnet: "${DATA_NETWORK_PREFIX:-10.242}.101.0/28"
  inventory-probe:
    ipam:
      config:
        - subnet: "${DATA_NETWORK_PREFIX:-10.242}.102.0/28"
  pricing-probe:
    ipam:
      config:
        - subnet: "${DATA_NETWORK_PREFIX:-10.242}.103.0/28"
  orders-probe:
    ipam:
      config:
        - subnet: "${DATA_NETWORK_PREFIX:-10.242}.104.0/28"
  analytics-probe:
    ipam:
      config:
        - subnet: "${DATA_NETWORK_PREFIX:-10.242}.105.0/28"
  logistics-probe:
    ipam:
      config:
        - subnet: "${DATA_NETWORK_PREFIX:-10.242}.106.0/28"
  crm-probe:
    ipam:
      config:
        - subnet: "${DATA_NETWORK_PREFIX:-10.242}.107.0/28"
  notification-probe:
    ipam:
      config:
        - subnet: "${DATA_NETWORK_PREFIX:-10.242}.108.0/28"
  broker-probe:
    ipam:
      config:
        - subnet: "${DATA_NETWORK_PREFIX:-10.242}.109.0/28"
